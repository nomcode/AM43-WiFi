esphome:
  name: am43-blinds
  friendly_name: Living Room Blinds

esp8266:
  board: esp12e  # ESP-12F uses this ESP8266 board profile

external_components:
  - source:
      type: local
      path: ../components
    components: [am43_uart]

logger:
  baud_rate: 0
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption: {}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

web_server:
  version: 3
  local: true
  log: false
  auth:
    type: digest
    username: !secret web_username
    password: !secret web_password

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 19200
  rx_buffer_size: 512

cover:
  - platform: am43_uart
    name: Cover
    id: blind_cover
    device_class: shade
    # Enable only after verifying the active-low motor reset connection.
    # reset_pin: GPIO5
    reported_position:
      name: Motor-reported position
      id: motor_reported_position
    battery:
      name: Battery
    light:
      name: Light Level
    speed:
      name: Motor Speed
    direction:
      name: Motor Direction
    operating_mode:
      name: Operating Mode
    upper_limit:
      name: Upper Limit Flag
    lower_limit:
      name: Lower Limit Flag

# ESPHome's web cover row provides direction and stop buttons. The number row
# provides percentage entry, with its state sourced from the motor sensor.
number:
  - platform: template
    name: Blind Position
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    lambda: |-
      if (!id(motor_reported_position).has_state())
        return {};
      return id(motor_reported_position).state;
    update_interval: 1s
    set_action:
      - cover.control:
          id: blind_cover
          position: !lambda return x / 100.0f;
